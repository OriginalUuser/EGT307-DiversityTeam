apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sensor-db-ha
  namespace: database-ns
  labels:
    app: database-app
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0
  managed:
    roles:
      - name: ml_user
        login: true
        passwordSecret:
          name: ml-user-credentials
  bootstrap:
    initdb:
      database: sensor-db
      owner: admin
      secret:
        name: postgres-credentials-admin
      postInitSQL:
        - CREATE DATABASE ml_artifacts OWNER ml_user;
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: postgres-local-disk
      volumeMode: Filesystem