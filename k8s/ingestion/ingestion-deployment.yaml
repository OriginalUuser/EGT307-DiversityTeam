apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-deploy
  namespace: ingestion-ns
  labels:
    app: ingestion-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-app
  template:
    metadata:
      labels:
        app: ingestion-app
    spec:
      containers:
      - name: ingestion-pipeline
        image: docker.io/matthewchristophertanmingwen/divteam_ingestion:0.15
        command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8080" ]
        resources:
          limits:
            memory: "512Mi"
            cpu: "250m"
          requests:
            memory: "256Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        env:
          - name: DATABASE_DNS
            valueFrom:
              configMapKeyRef:
                name: ingestion-config
                key: DATABASE_DNS
          - name: DATABASE_PORT
            valueFrom:
              configMapKeyRef:
                name: ingestion-config
                key: DATABASE_PORT
          - name: POSTGRES_PASS
            valueFrom:
              secretKeyRef:
                name: mirror-postgres-credentials-admin
                key: password

---

apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: ingestion-ns
spec:
  selector:
    app: ingestion-app
  ports:
  - name: monitor-frontend-port
    port: 81
    targetPort: 8080
    protocol: TCP

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-app-hpa
  namespace: ingestion-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-deploy
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75