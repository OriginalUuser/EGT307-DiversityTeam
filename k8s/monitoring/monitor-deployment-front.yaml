apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-front-deploy
  namespace: monitoring-ns
  labels:
    app: monitoring-frontapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-frontapp
  template:
    metadata:
      labels:
        app: monitoring-frontapp
    spec:
      volumes:
        - name: monitor-pv
          persistentVolumeClaim:
            claimName: monitor-pvc
      containers:
      - name: monitoring-frontend
        image: docker.io/originaluuser/divteam_monitoring_frontend:1.6
        command: ["/bin/sh", "-c"]
        args:
        - >-
          python3 ./setup_ws.py &&
          evidently ui --workspace /vol/workspace --host 0.0.0.0 --port 8000 
        resources:
          limits:
            memory: "512Mi"
            cpu: "250m"
          requests:
            memory: "256Mi"
            cpu: "50m"
        ports:
        - containerPort: 8000
        volumeMounts:
          - mountPath: /vol/
            name: monitor-pv
        env:
          - name: WORKSPACE_DIR
            valueFrom:
              configMapKeyRef:
                name: monitoring-config
                key: WORKSPACE_DIR

---

apiVersion: v1
kind: Service
metadata:
  name: monitoring-front-service
  namespace: monitoring-ns
spec:
  selector:
    app: monitoring-frontapp
  ports:
  - name: monitor-frontend-port
    port: 8000
    targetPort: 8000
    protocol: TCP

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monitoring-front-app-hpa
  namespace: monitoring-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoring-front-deploy
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75