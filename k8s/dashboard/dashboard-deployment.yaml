apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deploy
  namespace: dashboard-ns
  labels:
    app: dashboard-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-app
  template:
    metadata:
      labels:
        app: dashboard-app
    spec:
      containers:
      - name: dashboard-pipeline
        image: dashboard:v1              #docker.io/crapulous/main_repo:8
        imagePullPolicy: Never                
        command: ["streamlit", "run", "src/dashboard.py", "--server.port=8080", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
        resources:
          limits:
            memory: "512Mi"
            cpu: "250m"
          requests:
            memory: "256Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        env:
          - name: DATABASE_DNS
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: DATABASE_DNS
          - name: DATABASE_PORT
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: DATABASE_PORT
          - name: MONITORING_DNS
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: MONITORING_DNS
          - name: MONITORING_PORT
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: MONITORING_PORT
          - name: SENSORS
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: SENSORS 
          - name: POND
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: POND
          - name: DATA_AMOUNT
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: DATA_AMOUNT
          - name: POSTGRES_PASS
            valueFrom:
              secretKeyRef:
                name: mirror-postgres-credentials-admin
                key: password
        volumeMounts:
        - name: inference-storage
          mountPath: /app/data  
      volumes:
      - name: inference-storage
        persistentVolumeClaim:
          claimName: shared-data-pvc    

---

apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: dashboard-ns
spec:
  selector:
    app: dashboard-app
  ports:
  - name: dashboard-port
    port: 8081
    targetPort: 8080
    protocol: TCP

