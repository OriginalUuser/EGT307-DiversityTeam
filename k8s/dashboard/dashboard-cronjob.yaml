apiVersion: batch/v1
kind: CronJob
metadata:
  name: inference-scheduled-job
  namespace: dashboard-ns
spec:
  schedule: "*/10 * * * *" #Every 10 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: inference-engine
            image: docker.io/crapulous/div_team_getinference:1
            command: ["python", "src/get_inference.py"]
            env:
            - name: POND
              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: POND
            volumeMounts:
            - name: inference-storage
              mountPath: /app/data
          restartPolicy: OnFailure
          volumes:
          - name: inference-storage
            persistentVolumeClaim:
              claimName: shared-data-pvc